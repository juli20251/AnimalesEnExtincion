<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reservar Evento</title>
    <link rel="stylesheet" type="text/css" href="index.css" />
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📅 Reservar Evento</h1>
            <p>Completa el formulario para reservar tu lugar en el evento</p>
        </div>
        <div class="content">
            <!-- Formulario principal -->
            <form id="reservationForm">
                <!-- Datos del evento -->
                <div class="form-group">
                    <label>Evento:</label>
                    <input type="text" id="eventName" readonly>
                </div>
                <div class="form-group">
                    <label>Fecha:</label>
                    <input type="date" id="eventDate" readonly>
                </div>
                <div class="form-group">
                    <label>Hora:</label>
                    <input type="text" id="eventTime" readonly>
                </div>
                <div class="form-group">
                    <label>Precio por Persona:</label>
                    <input type="text" id="eventPrice" readonly>
                </div>

                <!-- Datos del cliente -->
                <div class="form-group">
                    <label>Nombre Completo:</label>
                    <input type="text" id="customerName" required>
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="customerEmail" required>
                </div>
                <div class="form-group">
                    <label>Teléfono:</label>
                    <input type="tel" id="customerPhone" required>
                </div>
                <div class="form-group">
                    <label>Cantidad de Personas:</label>
                    <input type="number" id="peopleCount" min="1" max="30" value="1" required>
                </div>

                <!-- Método de pago -->
                <div class="form-group">
                    <label>Método de Pago:</label>
                    <select id="paymentMethod" required>
                        <option value="">Seleccionar</option>
                        <option value="tarjeta">Tarjeta de Crédito/Débito</option>
                        <option value="efectivo">Efectivo (en taquilla)</option>
                    </select>
                </div>

                <!-- Botón de confirmación -->
                <button type="button" class="btn btn-success" onclick="processReservation()">
                    Confirmar pago
                </button>
            </form>

            <!-- Formulario de tarjeta -->
            <form id="cardForm" style="display: none; margin-top: 30px;">
                <h3>💳 Datos de la Tarjeta</h3>
                <div class="form-group">
                    <label>Número de Tarjeta:</label>
                    <input type="text" id="cardNumber" maxlength="19" placeholder="1234 5678 9012 3456" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Fecha de Expiración:</label>
                        <input type="text" id="cardExpiry" maxlength="5" placeholder="MM/AA" required>
                    </div>
                    <div class="form-group">
                        <label>Código de Seguridad (CVV):</label>
                        <input type="text" id="cardCVV" maxlength="3" placeholder="123" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Nombre en la Tarjeta:</label>
                    <input type="text" id="cardName" placeholder="Nombre Completo" required>
                </div>
                <button type="button" class="btn btn-success" onclick="processCardPayment()">
                    Confirmar Reserva
                </button>
            </form>

            <!-- Contenedor para mostrar el ticket -->
            <div id="ticketContainer" style="display: none; margin-top: 30px; text-align: center;">
                <h3>🎟️ Reserva generada correctamente</h3><br>
                <p id="ticketDetails" style="white-space: pre-wrap; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #e0e0e0;"></p>
                <a href="index.html" class="btn">Volver a Inicio</a>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Recuperar los datos del evento desde localStorage
            const selectedEvent = JSON.parse(localStorage.getItem('selectedEvent'));

            if (selectedEvent) {
                document.getElementById('eventName').value = selectedEvent.name;
                document.getElementById('eventDate').value = selectedEvent.date;
                document.getElementById('eventTime').value = selectedEvent.time;
                document.getElementById('eventPrice').value = `$${selectedEvent.price}`;
            }
        });

        function processReservation() {
            const paymentMethod = document.getElementById('paymentMethod').value;

            // Validar campos requeridos antes de proceder
            const customerName = document.getElementById('customerName').value;
            const customerEmail = document.getElementById('customerEmail').value;
            const customerPhone = document.getElementById('customerPhone').value;
            const peopleCount = document.getElementById('peopleCount').value;

            if (!customerName || !customerEmail || !customerPhone || !peopleCount || !paymentMethod) {
                alert('Por favor, completa todos los campos requeridos.');
                return;
            }

            if (paymentMethod === 'tarjeta') {
                // Ocultar el formulario principal y mostrar el formulario de tarjeta
                document.getElementById('reservationForm').style.display = 'none';
                document.getElementById('cardForm').style.display = 'block';
            } else if (paymentMethod === 'efectivo') {
                // Generar el ticket directamente si el método de pago es efectivo
                generateTicket();
            } else {
                alert('Por favor, selecciona un método de pago válido.');
            }
        }

        function processCardPayment() {
            const cardNumber = document.getElementById('cardNumber').value.replace(/\s+/g, '');
            const cardExpiry = document.getElementById('cardExpiry').value;
            const cardCVV = document.getElementById('cardCVV').value;
            const cardName = document.getElementById('cardName').value;

            if (!cardNumber || !cardExpiry || !cardCVV || !cardName) {
                alert('Por favor, completa todos los campos de la tarjeta.');
                return;
            }

            if (cardNumber.length !== 16 || isNaN(cardNumber)) {
                alert('El número de tarjeta debe tener 16 dígitos.');
                return;
            }

            if (!/^\d{2}\/\d{2}$/.test(cardExpiry)) {
                alert('La fecha de expiración debe tener el formato MM/AA.');
                return;
            }

            if (cardCVV.length !== 3 || isNaN(cardCVV)) {
                alert('El CVV debe tener 3 dígitos.');
                return;
            }

            // Ocultar el formulario de tarjeta y generar el ticket
            document.getElementById('cardForm').style.display = 'none';
            generateTicket();
        }

        function generateTicket() {
            const eventName = document.getElementById('eventName').value;
            const eventDate = document.getElementById('eventDate').value;
            const eventTime = document.getElementById('eventTime').value;
            const eventPriceText = document.getElementById('eventPrice').value;
            const eventPrice = parseFloat(eventPriceText.replace('$', ''));
            const customerName = document.getElementById('customerName').value;
            const customerEmail = document.getElementById('customerEmail').value;
            const customerPhone = document.getElementById('customerPhone').value;
            const peopleCount = parseInt(document.getElementById('peopleCount').value);
            const paymentMethod = document.getElementById('paymentMethod').value;

            const total = eventPrice * peopleCount;
            const reservationId = `RES-${Math.floor(100000 + Math.random() * 900000)}`;

            // Crear objeto de reserva
            const reservation = {
                id: reservationId,
                eventName,
                eventDate,
                eventTime,
                total,
                paymentMethod,
                customerName,
                customerEmail,
                customerPhone,
                peopleCount
            };

            // Obtener historial existente o crear array vacío
            let reservationHistory = JSON.parse(localStorage.getItem('reservationHistory')) || [];
            
            // Agregar nueva reserva
            reservationHistory.push(reservation);
            
            // Guardar en localStorage
            localStorage.setItem('reservationHistory', JSON.stringify(reservationHistory));

            const ticketDetails = `
Número de Reserva: ${reservationId}
Evento: ${eventName}
Fecha: ${eventDate}
Hora: ${eventTime}
Precio por Persona: ${eventPriceText}
Cantidad de Personas: ${peopleCount}
Total: $${total.toLocaleString()}
Nombre: ${customerName}
Email: ${customerEmail}
Teléfono: ${customerPhone}
Método de Pago: ${paymentMethod === 'tarjeta' ? 'Tarjeta' : 'Efectivo'}
            `;

            document.getElementById('ticketDetails').textContent = ticketDetails;
            document.getElementById('ticketContainer').style.display = 'block';
            
            alert('¡Reserva confirmada exitosamente!');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Comprar Entradas</title>
    <link rel="stylesheet" type="text/css" href="index.css" />
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎫 Comprar Entradas</h1>
            <p>Completa el formulario para adquirir tus entradas</p>
        </div>
        <div class="content">
            <!-- Contenedor para mostrar el historial de compras -->
            <div id="purchaseHistoryContainer" style="display: none; margin-top: 20px; text-align: center;">
                <h3>📜 Historial de Compras</h3>
                <ul id="purchaseHistory" style="list-style: none; padding: 0; background: #f8f9fa; border-radius: 8px; border: 1px solid #e0e0e0; padding: 15px;"></ul>
            </div>

            <!-- Formulario principal -->
            <form id="ticketForm">
                <!-- Selección de fecha de visita -->
                <div class="form-group">
                    <label>Fecha de Visita:</label>
                    <input type="date" id="visitDate" min="2025-01-01" max="2025-12-31" required>
                </div>
                
                <!-- Selección de cantidad de entradas por categoría -->
                <div class="form-row">
                    <div class="form-group">
                        <label>Adultos ($2,500):</label>
                        <input type="number" id="adults" min="0" value="0" onchange="updateTotal()">
                    </div>
                    <div class="form-group">
                        <label>Niños ($1,800):</label>
                        <input type="number" id="children" min="0" value="0" onchange="updateTotal()">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Adolescentes ($2,000):</label>
                        <input type="number" id="students" min="0" value="0" onchange="updateTotal()">
                    </div>
                    <div class="form-group">
                        <label>Jubilados ($1,500):</label>
                        <input type="number" id="seniors" min="0" value="0" onchange="updateTotal()">
                    </div>
                </div>
                
                <!-- Cálculo automático del total -->
                <div class="card" style="background: #f8f9fa; margin: 20px 0; padding: 15px;">
                    <h4 style="color: #2c3e50;">Total: $<span id="totalPrice">0</span></h4>
                </div>
                
                <!-- Datos del comprador -->
                <div class="form-group">
                    <label>Nombre Completo:</label>
                    <input type="text" id="customerName" required>
                </div>
                
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="customerEmail" required>
                </div>
                
                <div class="form-group">
                    <label>Teléfono:</label>
                    <input type="tel" id="customerPhone" required>
                </div>
                
                <!-- Método de pago -->
                <div class="form-group">
                    <label>Método de Pago:</label>
                    <select id="paymentMethod" autocomplete="on" required>
                        <option value="">Seleccionar</option>
                        <option value="tarjeta">Tarjeta de Crédito/Débito</option>
                        <option value="efectivo">Efectivo (en taquilla)</option>
                    </select>
                </div>
                
                <!-- Botón de procesamiento de pago -->
                <button type="button" class="btn btn-success" onclick="processPayment()">
                    Procesar Pago
                </button>
            </form>

            <!-- Formulario de tarjeta -->
            <form id="cardForm" style="display: none; margin-top: 30px;">
                <h3>💳 Datos de la Tarjeta</h3>
                <div class="form-group">
                    <label>Número de Tarjeta:</label>
                    <input type="text" id="cardNumber" maxlength="19" placeholder="1234 5678 9012 3456" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Fecha de Expiración:</label>
                        <input type="text" id="cardExpiry" maxlength="5" placeholder="MM/AA" required>
                    </div>
                    <div class="form-group">
                        <label>Código de Seguridad (CVV):</label>
                        <input type="text" id="cardCVV" maxlength="3" placeholder="123" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Nombre en la Tarjeta:</label>
                    <input type="text" id="cardName" placeholder="Nombre Completo" required>
                </div>
                <button type="button" class="btn btn-success" onclick="processCardPayment()">
                    Confirmar
                </button>
            </form>

            <!-- Contenedor para mostrar el ticket -->
            <div id="ticketContainer" style="display: none; margin-top: 30px; text-align: center;">
                <h3>🎟️ Ticket generado correctamente, porfavor presentarlo en la taquilla</h3><br>
                <p id="ticketDetails" style="white-space: pre-wrap; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #e0e0e0;"></p>
                <a href="index.html" class="btn">Volver a Inicio</a>
            </div>

            
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
